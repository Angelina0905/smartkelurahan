<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SmartKelurahan</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec4899);
        min-height: 100vh;
        color: white;
        overflow-x: hidden;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: auto;
        padding: 40px 20px;
      }

      .hero {
        text-align: center;
        margin-bottom: 50px;
      }

      .hero h1 {
        font-size: 4rem;
        margin-bottom: 15px;
      }

      .hero p {
        font-size: 1.2rem;
        max-width: 700px;
        margin: auto;
        opacity: 0.95;
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 25px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      .card h2 {
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      input,
      textarea {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        outline: none;
        font-size: 1rem;
      }

      textarea {
        min-height: 120px;
        resize: none;
      }

      input[type="file"] {
        background: white;
        color: black;
      }

      button {
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: white;
        color: #6d28d9;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-3px);
        background: #f3f4f6;
      }

      .laporan-item {
        background: rgba(255, 255, 255, 0.12);
        padding: 18px;
        border-radius: 16px;
        margin-bottom: 15px;
      }

      .laporan-item h3 {
        margin-bottom: 8px;
      }

      .laporan-item img {
        width: 100%;
        border-radius: 12px;
        margin-top: 12px;
      }

      @media (max-width: 900px) {
        .main-content {
          grid-template-columns: 1fr;
        }

        .hero h1 {
          font-size: 2.8rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">

      <!-- HERO -->
      <section class="hero">
        <h1>SmartKelurahan</h1>
        <p>
          Platform pelayanan masyarakat berbasis cloud untuk pengajuan laporan,
          pengaduan warga, dan penyimpanan file online menggunakan AWS.
        </p>
      </section>

      <!-- CONTENT -->
      <section class="main-content">

        <!-- FORM -->
        <div class="card">
          <h2>📢 Form Pengaduan</h2>

          <form>
            <input type="text" placeholder="Masukkan Nama" />

            <textarea
              placeholder="Tulis pengaduan atau laporan..."
            ></textarea>

            <input type="file" />

            <button type="submit">
              Kirim Pengaduan
            </button>
          </form>
        </div>

        <!-- LIST -->
        <div class="card">
          <h2>📄 Laporan Warga</h2>

          <div class="laporan-item">
            <h3>Angelina</h3>
            <p>Jalan rusak di depan balai desa.</p>

            <img
              src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
              alt="Laporan"
            />
          </div>

          <div class="laporan-item">
            <h3>Budi</h3>
            <p>Lampu jalan mati sejak kemarin malam.</p>

            <img
              src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e"
              alt="Laporan"
            />
          </div>

        </div>

      </section>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
